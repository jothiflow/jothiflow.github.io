<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join Jothiflow</title>
  <meta name="description" content="Sign up to hear from Jothiflow.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="lang">
      <label for="lang" data-i18n="language">Language</label>
      <select id="lang" name="lang"></select>
    </div>

    <section id="form-view">
      <h1 data-i18n="heading">Join Jothiflow</h1>
      <p class="intro" data-i18n="intro">Leave your details and we will keep you posted.</p>

      <form id="signup" novalidate>
        <div class="field">
          <label for="firstName" data-i18n="firstName">First name</label>
          <input id="firstName" name="firstName" autocomplete="given-name" required maxlength="100">
          <p class="error" id="firstName-error" hidden></p>
        </div>

        <div class="field">
          <label for="lastName"><span data-i18n="lastName">Last name</span> <span class="muted" data-i18n="optional">(optional)</span></label>
          <input id="lastName" name="lastName" autocomplete="family-name" maxlength="100">
          <p class="error" id="lastName-error" hidden></p>
        </div>

        <div class="field">
          <label for="email" data-i18n="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
          <p class="error" id="email-error" hidden></p>
        </div>

        <div class="field">
          <label for="phone"><span data-i18n="phone">Phone</span> <span class="muted" data-i18n="optional">(optional)</span></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="20">
          <p class="error" id="phone-error" hidden></p>
        </div>

        <div class="field check">
          <input id="consent" name="consent" type="checkbox">
          <label for="consent" data-i18n="consent">I agree to receive emails from Jothiflow. I can unsubscribe at any time.</label>
          <p class="error" id="consent-error" hidden></p>
        </div>

        <!-- Honeypot: invisible to humans, bots fill it. -->
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">

        <div id="turnstile"></div>

        <p class="error form-error" id="form-error" role="alert" hidden></p>
        <button type="submit" id="submit" data-i18n="submit">Sign up</button>
      </form>
    </section>

    <section id="success-view" hidden aria-live="polite">
      <h1 data-i18n="successTitle">Thank you!</h1>
      <p data-i18n="successBody">You are on the list. Check your inbox for our next message.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
